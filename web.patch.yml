- id: agent-presets
  config:
    default: message-agent
    roots:
      - path: !!js process.env.MESSAGE_AGENT_ROOT + '/presets'
        trust: system
    includeShippedRoot: true
    includeUserRoot: true
- id: permission
  config:
    presets:
      read-only: {sandbox: read-only, approval: ask}
      workspace-write: {sandbox: workspace-write, approval: ask}
      danger-full-access: {sandbox: danger-full-access, approval: never}
      message-auto: {sandbox: read-only, approval: never, name: '自动消息任务'}

# 消息产品只保留 messaging-runtime MCP 工具（+ 自动回复的 submit_reply_decision），
# 关闭 Harness base 里通用的编码/联网/子代理等模型工具，减少每轮注入的 tool schema。
# 只禁用面向模型的 tool-* 行，不动其底层 provider/service。
- id: tool-web
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-jobs
  disabled: true
- insert:
    - id: messaging-agent-ui
      name: './plugin/index.mjs'
